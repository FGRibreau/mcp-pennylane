[workspace]
resolver = "2"
members = ["server", "scripts/refresh-openapi"]

[workspace.package]
authors = ["François-Guillaume Ribreau <rust@fgribreau.com>"]
license = "MIT"
repository = "https://github.com/FGRibreau/mcp-pennylane"
edition = "2021"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
bytes = "1"
rmcp = { version = "3.6", features = ["server", "transport-io", "transport-streamable-http-server"] }
